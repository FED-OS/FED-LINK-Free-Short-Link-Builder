# FED-LINk — root Docker Compose stack for the builder.
#
# Convenience copy at the repository root (`docker compose up --build`).
# Same services as scripts/docker/docker-compose.yml, with volume paths
# adjusted for the root context (./output instead of ../../output).
#
# Usage:
#   docker compose up --build builder     # build output/ + links.zip
#   docker compose run --rm validate      # validation only (tools profile)
#   docker compose --profile tools up dashboard   # Streamlit example

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: fedlink
    container_name: fedlink-builder
    volumes:
      - ./output:/app/output
      - ./links.zip:/app/links.zip
    command: build configs/links.json --output output --zip links.zip

  validate:
    image: fedlink
    depends_on:
      - builder
    profiles: ["tools"]
    command: validate configs/links.json

  dashboard:
    image: fedlink
    depends_on:
      - builder
    profiles: ["tools"]
    ports:
      - "8501:8501"
    volumes:
      - ./examples/streamlit_dashboard:/app/dashboard
      - ./configs:/app/configs
    command: >
      sh -c "pip install --no-cache-dir streamlit pyyaml
      && streamlit run dashboard/app.py"
