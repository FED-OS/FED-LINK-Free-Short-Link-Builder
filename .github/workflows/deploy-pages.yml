name: Deploy Pages

# Deploys the generated short link bundle to GitHub Pages. This mirrors the
# InfinityFree deployment so every short link also works under
# https://<owner>.github.io/<repo>/<slug> as a free backup.

on:
  push:
    branches: [main, master]
    paths:
      - "configs/**"
      - "src/**"
      - "templates/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate the redirect bundle
        run: python -m src.main build configs/links.json --output output --no-zip

      - name: Add Pages plumbing
        run: |
          # .nojekyll disables Jekyll, which would swallow our dotfiles
          touch output/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
