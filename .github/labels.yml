# Label taxonomy used by the labeler workflow and issue triage.
labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: invalid
    color: e4e669
    description: This doesn't seem right
  - name: question
    color: d876e3
    description: Further information is requested
  - name: wontfix
    color: ffffff
    description: This will not be worked on
  - name: android
    color: 3ddc84
    description: Android app builds and issues
  - name: desktop
    color: 0078d4
    description: Desktop app builds and issues
  - name: links
    color: 0e8a16
    description: Changes to the short link configuration
  - name: security
    color: b60205
    description: Security related report or fix
  - name: stale
    color: cccccc
    description: No activity for a while

# File-path rules for actions/labeler (sync-labels keeps these accurate).
# Keys are label names; values are glob patterns for changed files.
bug:
  - head-branch: ["^fix/", "bugfix"]
  - changed-files:
      - any-files-to-match:
          - "src/**"

enhancement:
  - head-branch: ["^feat/", "feature"]
  - changed-files:
      - any-files-to-match:
          - "src/**"

documentation:
  - changed-files:
      - any-files-to-match:
          - "docs/**"
          - "*.md"

links:
  - changed-files:
      - any-files-to-match:
          - "configs/**"
          - "templates/**"

desktop:
  - changed-files:
      - any-files-to-match:
          - "pyinstaller.spec"
          - ".github/workflows/build-desktop.yml"

android:
  - changed-files:
      - any-files-to-match:
          - "buildozer.spec"
          - ".github/workflows/build-android.yml"
