name: Build

# Core FED-LINk build: validate links, generate the redirect bundle and
# upload links.zip as an artifact for manual upload to InfinityFree.

on:
  push:
    branches: [main, master]
    paths:
      - "configs/**"
      - "src/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "configs/**"
      - "src/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate short link bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate links files
        run: python -m src.main validate configs/links.json

      - name: Build bundle and ZIP
        run: python -m src.main build configs/links.json --output output --zip links.zip

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: links-bundle
          path: links.zip
          retention-days: 30
          if-no-files-found: error
