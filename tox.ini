# FED-LINk tox configuration.
#
# Local multi-environment testing — the same job the test.yml workflow
# runs as a 3.10 / 3.11 / 3.12 matrix in CI.
#
# Usage:
#   pip install tox
#   tox                  # run every env (py310, py311, py312)
#   tox -e py311         # one environment only
#   tox -e lint          # ruff check + format check
#   tox -e build         # build the redirect bundle + links.zip
#
# Requires the interpreters to be available on PATH (pyenv, deadsnakes,
# or system packages). tox skips environments whose interpreter is
# missing when skip_missing_interpreters is true.

[tox]
envlist = py310, py311, py312, lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the pytest suite (mirrors test.yml's matrix job)
deps =
    pytest>=7.4
    pyyaml>=6.0
commands =
    pytest {posargs}

[testenv:lint]
description = ruff check + format check (mirrors ci.yml's lint job)
skip_install = true
deps = ruff>=0.4
commands =
    ruff check src/ tests/ scripts/ examples/
    ruff format --check src/ tests/ scripts/ examples/ --exit-zero
